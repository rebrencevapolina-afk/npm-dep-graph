# Пример конфигурации для инструмента визуализации зависимостей npm
# Скопируйте этот файл как config.yaml и отредактируйте под себя

# Имя анализируемого пакета (обязательно)
package_name: "express"

# URL репозитория или путь к локальному файлу тестового репозитория
repo_url: "https://registry.npmjs.org"
# Для режима тестирования (test_mode: true) укажите путь:
# repo_url: "./tests/fixtures/test_repo.yaml"

# Режим работы: true — использовать локальный тестовый файл,
#                false — обращаться к реальному npm registry
test_mode: false

# Максимальная глубина анализа зависимостей (целое число >= 1)
max_depth: 3